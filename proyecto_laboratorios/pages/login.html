<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Administración Laboratorios</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="../assets/imagenes/logo-insuco.png" alt="Logo Liceo INSUCO" class="logo-img">
            </div>
            <div class="logo">
                <h1>Laboratorios INSUCO</h1>
            </div>
            <ul class="menu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="laboratorios.html">Laboratorios</a></li>
                <li><a href="sobre-mi.html">Sobre Mi</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="mapa.html">Mapa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <h2>Acceso Administrativo</h2>
            <p>Ingresa con tu correo institucional para gestionar los laboratorios</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="profesor@insuco.cl" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-login">Iniciar Sesión</button>
                <div id="loginMessage" class="message"></div>
            </form>
            
            <div id="userInfo" style="display:none;">
                <p>✅ Sesión iniciada como: <span id="userEmail"></span></p>
                <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Laboratorios INSUCO. Todos los derechos reservados</p>
        <div class="footer-redes">
            <a href="https://www.facebook.com/share/1HpYqfM4oQ/" target="_blank" rel="noopener noreferrer">📘 Facebook</a>
            <a href="https://www.instagram.com/insucovalparaiso?stkn=ams1cDF2bjFpejI1" target="_blank" rel="noopener noreferrer">📸 Instagram</a>
        </div>
    </footer>

    <div class="watermark">INSUCO</div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
